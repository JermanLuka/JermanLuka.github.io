<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Letters are drawn as paths rather than <text>: an SVG that names a font
       renders differently wherever that font is missing, which is most machines
       that are not this one. As geometry the mark is identical everywhere, and
       its bounding box is exactly 16..48 on both axes, so it is centred by
       construction rather than by eye. -->
  <rect width="64" height="64" rx="14" fill="#020617" />
  <g fill="#f8fafc">
    <path d="M16 16h6v26h8v6H16z" />
    <path d="M42 16h6v20c0 6.6-5.4 12-12 12h-2v-6h2c3.3 0 6-2.7 6-6z" />
  </g>
</svg>
